<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Heart Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            cursor: grab;
        }
        body:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #heart-svg {
            display: none;
        }
    </style>

    <!-- Three.js va OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <svg id="heart-svg" viewBox="0 0 512 512">
        <path class="path" d="M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z"/>
    </svg>

    <canvas id="webgl"></canvas>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('webgl');
            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 300;

            const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Sichqoncha orqali aylantirish
            const controls = new THREE.OrbitControls(camera, canvas);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // SVG dan yurak konturini olish
            const path = document.querySelector('.path');
            const length = path.getTotalLength();

            // 1. Yurak Chizig'i (Neon Glow Line)
            const linePoints = [];
            const pointsCount = 500;
            for (let i = 0; i <= pointsCount; i++) {
                const pt = path.getPointAtLength((i / pointsCount) * length);
                linePoints.push(new THREE.Vector3((pt.x - 256) * 0.5, -(pt.y - 256) * 0.5, 0));
            }

            const lineGeometry = new THREE.BufferGeometry().setFromPoints(linePoints);
            const lineMaterial = new THREE.LineBasicMaterial({
                color: 0xff33aa,
                linewidth: 2,
                transparent: true,
                opacity: 0.9
            });
            const heartLine = new THREE.Line(lineGeometry, lineMaterial);
            scene.add(heartLine);

            // 2. Yurak atrofidagi uchib yuruvchi neon zarrachalar
            const particleCount = 2500;
            const particleGeo = new THREE.BufferGeometry();
            const posArray = new Float32Array(particleCount * 3);
            const colorArray = new Float32Array(particleCount * 3);

            const baseColors = [new THREE.Color('#ff0055'), new THREE.Color('#7700ff'), new THREE.Color('#00ffff')];

            for (let i = 0; i < particleCount; i++) {
                const pt = path.getPointAtLength(Math.random() * length);

                // Zarrachalarni chiziq atrofida tarqatish
                const spread = 25;
                posArray[i * 3] = (pt.x - 256) * 0.5 + (Math.random() - 0.5) * spread;
                posArray[i * 3 + 1] = -(pt.y - 256) * 0.5 + (Math.random() - 0.5) * spread;
                posArray[i * 3 + 2] = (Math.random() - 0.5) * spread;

                // Tasodifiy neon ranglar
                const randomColor = baseColors[Math.floor(Math.random() * baseColors.length)];
                colorArray[i * 3] = randomColor.r;
                colorArray[i * 3 + 1] = randomColor.g;
                colorArray[i * 3 + 2] = randomColor.b;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

            const particleMat = new THREE.PointsMaterial({
                size: 2.5,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.8
            });

            const particleSystem = new THREE.Points(particleGeo, particleMat);
            scene.add(particleSystem);

            // Oyna o'lchami o'zgarganda
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Animatsiya va tebranish
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                const elapsedTime = clock.getElapsedTime();

                // Yurak urishi va tebranish effekti
                const scale = 1 + Math.sin(elapsedTime * 3) * 0.05;
                heartLine.scale.set(scale, scale, scale);
                particleSystem.scale.set(scale, scale, scale);

                // Ranglar o'tib turishi va sekin aylanish
                particleSystem.rotation.y = Math.sin(elapsedTime * 0.5) * 0.2;
                heartLine.rotation.y = Math.sin(elapsedTime * 0.5) * 0.2;

                controls.update();
                renderer.render(scene, camera);
            }

            animate();
        });
    </script>
</body>
</html>
